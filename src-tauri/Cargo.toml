[package]
name = "maple-classic-companion"
version = "1.1.0"
description = "Maple Classic Companion"
authors = ["ViciousTaco"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maple_classic_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-single-instance = "2"
minisign-verify = "0.3.0"
base64 = "0.23.1"
self-replace = "1.5.0"
# No default features: the default `cookies` feature writes a `.cookies` jar to %LOCALAPPDATA% (breaks portability).
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
sha2 = "0.10"
# Ctrl+Alt+W toggles the screen watcher (I-29); receives the hotkey only, never sends input.
tauri-plugin-global-shortcut = "2"
# Event reminders (I-26); see notify.rs for the portable-exe fallback.
tauri-plugin-notification = "2"
# Encodes the one-off setup snapshot (screen.rs); already in the tree via tauri.
png = "0.18"

# Screen watcher (I-29, D-10 amended): GDI screen copy + Windows.Media.Ocr. Same `windows` version as tauri/wry.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
